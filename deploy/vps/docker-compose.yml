name: glaux-ledger

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glaux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glaux_ledger
      GLAUX_APP_PASSWORD: ${GLAUX_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glaux -d glaux_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://glaux_app:${GLAUX_APP_PASSWORD}@db:5432/glaux_ledger
      MIGRATION_DATABASE_URL: postgresql+psycopg://glaux:${POSTGRES_PASSWORD}@db:5432/glaux_ledger
      ADMIN_DATABASE_URL: postgresql+psycopg://glaux:${POSTGRES_PASSWORD}@db:5432/glaux_ledger
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
      ADMIN_JWT_EXPIRE_MINUTES: ${ADMIN_JWT_EXPIRE_MINUTES:-480}
      PARSER_PROVIDER: ${PARSER_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CALLS_PER_MONTH: ${AI_CALLS_PER_MONTH:-500}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Only Caddy reaches this container; do not publish port 8000 on the host.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # No host ports — traffic enters via Caddy only.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
