name: glaux-ledger

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glaux
      POSTGRES_PASSWORD: glaux_dev_password
      POSTGRES_DB: glaux_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glaux -d glaux_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only runs under `docker compose --profile full up`. Its purpose is to verify the
  # production image builds and boots before pushing to Railway; day-to-day dev runs
  # uvicorn natively for fast reload.
  api:
    profiles: ["full"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://glaux:glaux_dev_password@db:5432/glaux_ledger
      JWT_SECRET: insecure-compose-only-secret-do-not-use-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
