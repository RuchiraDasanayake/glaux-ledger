<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The Glaux type trio, shared with useglaux and Glaux Markets: Marcellus for brand
         moments, Schibsted Grotesk for the interface, Spline Sans Mono for every figure.
         Marcellus ships one weight by design. Noto covers Sinhala and Tamil, which none
         of the three do. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Serif+Sinhala:wght@400&display=swap"
      rel="stylesheet"
    />
